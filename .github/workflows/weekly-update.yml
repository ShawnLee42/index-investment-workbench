name: Weekly Index Update

on:
  schedule:
    # UTC 周六 08:00 = 北京时间周六 16:00
    - cron: '0 8 * * 6'
  workflow_dispatch:
    inputs:
      full:
        description: '全量重新获取 (忽略已有数据)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Run update script
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            uv run scripts/update_index.py --full
          else
            uv run scripts/update_index.py
          fi
        env:
          TZ: Asia/Shanghai

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly data update: $(date -u '+%Y-%m-%d')"
            git push
          fi
